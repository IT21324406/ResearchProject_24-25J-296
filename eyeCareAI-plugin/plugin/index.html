<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeCare AI Plugin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="plugin-container">
        <h1>EyeCare AI Plugin</h1>
        
        <!-- 1. Existing User Dropdown -->
        <div class="dropdown-container">
            <label for="existingUsers">Select Existing User:</label>
            <select id="existingUsers">
                <option value="">--Select--</option>
            </select>
        </div>
        
        <!-- 2. New User Button -->
        <div class="new-user-container">
            <button id="newUserBtn">New User</button>
        </div>
        
        <!-- 3. Delete User Section -->
        <div class="delete-user-container">
            <label for="deleteUser">Delete User:</label>
            <select id="deleteUser">
                <option value="">--Select--</option>
            </select>
            <button id="deleteUserBtn">Delete User</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
