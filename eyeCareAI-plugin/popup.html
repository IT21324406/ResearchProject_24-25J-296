<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeCare AI Plugin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="p-3">
    <h2 class="text-center fs-5 mb-3">EyeCare AI Plugin</h2>

    <div class="mb-2">
        <label for="user-select" class="form-label"><i class="fa-solid fa-user"></i> Select User:</label>
        <select id="user-select" class="form-select">
            <option value="" disabled selected>Select a user</option>
        </select>
    </div>

    <!-- Theme Info Section -->
    <div id="theme-info" class="p-2 border rounded bg-light">
        <!-- Theme details will be injected dynamically -->
    </div>
    <button id="apply-theme-btn" class="btn btn-primary w-100 mt-2">
        <i class="fa-solid fa-paint-brush"></i> Apply Theme
    </button>
    <div class="mt-3 d-flex justify-content-between">
        <button id="new-user-btn" class="btn btn-success btn-sm">
            <i class="fa-solid fa-user-plus"></i> New User
        </button>
        <button id="delete-user-btn" class="btn btn-danger btn-sm">
            <i class="fa-solid fa-user-minus"></i> Delete User
        </button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
